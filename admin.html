<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VectorHub - Admin Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-100 text-gray-800">

  <!-- LOGIN BOX -->
  <div id="loginBox" class="flex items-center justify-center min-h-screen px-4">
    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-gray-100">
      <div class="text-center mb-6">
        <div class="w-12 h-12 bg-yellow-400 text-slate-900 rounded-xl flex items-center justify-center mx-auto mb-3 text-xl font-bold shadow-md">
          <i class="fa-solid fa-lock"></i>
        </div>
        <h2 class="text-2xl font-bold text-slate-900">Admin Login</h2>
        <p class="text-sm text-gray-500">Enter password to manage VectorHub</p>
      </div>
      <form onsubmit="checkPassword(event)">
        <div class="mb-4">
          <label class="block text-sm font-semibold text-gray-700 mb-2">Password</label>
          <input type="password" id="adminPass" required class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-yellow-400 focus:outline-none text-base" placeholder="Enter admin password">
        </div>
        <button type="submit" class="w-full py-3 bg-yellow-500 hover:bg-yellow-400 text-slate-900 font-bold rounded-xl shadow-md transition text-base">
          Login to Dashboard
        </button>
      </form>
    </div>
  </div>

  <!-- ADMIN PANEL (HIDDEN BY DEFAULT) -->
  <div id="adminPanel" class="hidden min-h-screen pb-12">
    <!-- Navbar -->
    <nav class="bg-slate-900 text-white shadow-md sticky top-0 z-50">
      <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
        <h1 class="text-xl font-bold text-yellow-400 flex items-center gap-2">
          <i class="fa-solid fa-gauge-high"></i> VectorHub Admin Dashboard
        </h1>
        <div class="flex items-center gap-4">
          <a href="index.html" target="_blank" class="text-sm bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg border border-slate-700 transition">
            <i class="fa-solid fa-house mr-1"></i> Go to Home
          </a>
          <button onclick="logoutAdmin()" class="text-sm bg-red-500/20 text-red-400 hover:bg-red-500 hover:text-white px-3 py-1.5 rounded-lg transition font-medium">
            <i class="fa-solid fa-right-from-bracket mr-1"></i> Logout
          </button>
        </div>
      </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 py-6 space-y-10">
      
      <!-- SECTION 1: ADD NEW DESIGN -->
      <section class="bg-white rounded-2xl shadow-sm border border-gray-200 p-6 md:p-8">
        <div class="flex items-center gap-3 mb-6 pb-4 border-b border-gray-100">
          <div class="w-10 h-10 bg-yellow-100 text-yellow-600 rounded-lg flex items-center justify-center font-bold">
            <i class="fa-solid fa-plus"></i>
          </div>
          <div>
            <h2 class="text-xl font-bold text-slate-900">Add New Design</h2>
            <p class="text-sm text-gray-500">Upload new vector artwork or jersey design</p>
          </div>
        </div>

        <form id="designForm" class="space-y-6">
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
              <label class="block text-sm font-semibold text-gray-700 mb-2">Design Title</label>
              <input type="text" id="title" required class="w-full px-4 py-2.5 rounded-xl border border-gray-300 focus:ring-2 focus:ring-yellow-400 focus:outline-none" placeholder="Ex: Sri Lanka Sublimation Cricket Jersey">
            </div>
            <div>
              <label class="block text-sm font-semibold text-gray-700 mb-2">Downloadable File Link (Drive / Mega)</label>
              <input type="url" id="fileUrl" required class="w-full px-4 py-2.5 rounded-xl border border-gray-300 focus:ring-2 focus:ring-yellow-400 focus:outline-none" placeholder="https://...">
            </div>
          </div>

          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-2">Description</label>
            <textarea id="description" rows="3" class="w-full px-4 py-2.5 rounded-xl border border-gray-300 focus:ring-2 focus:ring-yellow-400 focus:outline-none" placeholder="Enter design details..."></textarea>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div>
              <label class="block text-sm font-semibold text-gray-700 mb-2">Tags (Comma separated)</label>
              <input type="text" id="tags" class="w-full px-4 py-2.5 rounded-xl border border-gray-300 focus:ring-2 focus:ring-yellow-400 focus:outline-none" placeholder="cricket, jersey, blue">
            </div>
            
            <!-- MULTI-SELECTION CATEGORIES -->
            <div>
              <label class="block text-sm font-semibold text-gray-700 mb-2">Select Categories (Multi-select)</label>
              <div class="border border-gray-300 rounded-xl p-3 h-32 overflow-y-auto space-y-2 bg-gray-50" id="categoryCheckboxes">
                <label class="flex items-center gap-2 text-sm cursor-pointer"><input type="checkbox" value="Jersey" class="cat-checkbox rounded text-yellow-500 focus:ring-yellow-400"> Jersey</label>
                <label class="flex items-center gap-2 text-sm cursor-pointer"><input type="checkbox" value="Vector" class="cat-checkbox rounded text-yellow-500 focus:ring-yellow-400"> Vector</label>
                <label class="flex items-center gap-2 text-sm cursor-pointer"><input type="checkbox" value="Logo" class="cat-checkbox rounded text-yellow-500 focus:ring-yellow-400"> Logo</label>
                <label class="flex items-center gap-2 text-sm cursor-pointer"><input type="checkbox" value="Cricket" class="cat-checkbox rounded text-yellow-500 focus:ring-yellow-400"> Cricket</label>
                <label class="flex items-center gap-2 text-sm cursor-pointer"><input type="checkbox" value="Football" class="cat-checkbox rounded text-yellow-500 focus:ring-yellow-400"> Football</label>
              </div>
            </div>

            <div class="space-y-4">
              <div>
                <label class="block text-sm font-semibold text-gray-700 mb-2">Type</label>
                <select id="type" onchange="togglePriceInput()" class="w-full px-4 py-2.5 rounded-xl border border-gray-300 focus:ring-2 focus:ring-yellow-400 focus:outline-none">
                  <option value="Free">Free</option>
                  <option value="Paid">Paid</option>
                </select>
              </div>
              <div id="priceContainer" class="hidden">
                <label class="block text-sm font-semibold text-gray-700 mb-2">Price ($)</label>
                <input type="number" id="price" value="0" class="w-full px-4 py-2.5 rounded-xl border border-gray-300 focus:ring-2 focus:ring-yellow-400 focus:outline-none" placeholder="9.99">
              </div>
            </div>
          </div>

          <div>
            <label class="block text-sm font-semibold text-gray-700 mb-2">Upload Preview Image (JPG/PNG)</label>
            <input type="file" id="imageFile" accept="image/*" required class="w-full px-3 py-2 rounded-xl border border-gray-300 text-sm file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-yellow-50 file:text-yellow-700 hover:file:bg-yellow-100">
          </div>

          <button type="submit" id="submitBtn" class="w-full py-3.5 bg-yellow-500 hover:bg-yellow-400 text-slate-900 font-bold rounded-xl shadow-md transition text-base">
            Save & Publish Design
          </button>
        </form>
      </section>

      <!-- SECTION 2: MANAGE & FILTER DESIGNS -->
      <section class="bg-white rounded-2xl shadow-sm border border-gray-200 p-6 md:p-8">
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6 pb-4 border-b border-gray-100">
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-slate-900 text-yellow-400 rounded-lg flex items-center justify-center font-bold">
              <i class="fa-solid fa-list-check"></i>
            </div>
            <div>
              <h2 class="text-xl font-bold text-slate-900">Manage Designs</h2>
              <p class="text-sm text-gray-500">Filter, review and delete uploaded designs</p>
            </div>
          </div>

          <!-- FILTER CONTROLS -->
          <div class="flex flex-wrap items-center gap-3">
            <select id="filterCategory" onchange="applyFilters()" class="px-3 py-2 text-sm rounded-xl border border-gray-300 bg-gray-50 focus:outline-none">
              <option value="all">All Categories</option>
              <option value="Jersey">Jersey</option>
              <option value="Vector">Vector</option>
              <option value="Logo">Logo</option>
              <option value="Cricket">Cricket</option>
              <option value="Football">Football</option>
            </select>

            <select id="filterType" onchange="applyFilters()" class="px-3 py-2 text-sm rounded-xl border border-gray-300 bg-gray-50 focus:outline-none">
              <option value="all">All Types (Free/Paid)</option>
              <option value="Free">Free</option>
              <option value="Paid">Paid</option>
            </select>

            <select id="filterDate" onchange="applyFilters()" class="px-3 py-2 text-sm rounded-xl border border-gray-300 bg-gray-50 focus:outline-none">
              <option value="newest">Newest First</option>
              <option value="oldest">Oldest First</option>
            </select>
          </div>
        </div>

        <!-- MANAGE TABLE / GRID -->
        <div id="manageContainer" class="overflow-x-auto">
          <!-- Dynamically filled table -->
        </div>
      </section>

    </main>
  </div>

  <!-- SCRIPTS -->
  <script type="module">
    import { listenToDesigns, addDesignToFirebase, deleteDesignFromFirebase } from './data.js';

    const IMGBB_API_KEY = "65084afc5235c6edfeaae7b01cb7cc41"; // உங்கள் ImgBB API Key-ஐ இங்கே போடவும்

    window.checkPassword = function(event) {
      event.preventDefault();
      const pass = document.getElementById('adminPass').value;
      if (pass === "admin123") {
        document.getElementById('loginBox').classList.add('hidden');
        document.getElementById('adminPanel').classList.remove('hidden');
      } else {
        alert("Incorrect Password!");
      }
    };

    window.logoutAdmin = function() {
      document.getElementById('adminPanel').classList.add('hidden');
      document.getElementById('loginBox').classList.remove('hidden');
      document.getElementById('adminPass').value = '';
    };

    window.togglePriceInput = function() {
      const type = document.getElementById('type').value;
      const priceContainer = document.getElementById('priceContainer');
      if (type === 'Paid') {
        priceContainer.classList.remove('hidden');
      } else {
        priceContainer.classList.add('hidden');
      }
    };

    // Listen to Firebase Data
    listenToDesigns((designs) => {
      window.allAdminDesigns = designs;
      applyFilters();
    });

    // ImgBB Upload Function
    async function uploadImageToImgBB(file) {
      const formData = new FormData();
      formData.append("image", file);

      const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
        method: 'POST',
        body: formData
      });

      const data = await response.json();
      if (data.success && data.data) {
        return data.data.url || data.data.display_url;
      } else {
        throw new Error(data.error ? data.error.message : "ImgBB Upload Failed");
      }
    }

    // Handle Form Submit
    const designForm = document.getElementById("designForm");
    if (designForm) {
      designForm.addEventListener("submit", async function(event) {
        event.preventDefault();
        
        const submitBtn = document.getElementById("submitBtn");
        submitBtn.disabled = true;
        submitBtn.innerText = "Uploading Image to ImgBB...";

        try {
          const imageFileInput = document.getElementById("imageFile");
          const imageFile = imageFileInput.files[0];

          if (!imageFile) {
            alert("Please select an image file!");
            submitBtn.disabled = false;
            submitBtn.innerText = "Save & Publish Design";
            return;
          }

          // Gather Selected Categories (Multi-select)
          const selectedCategories = [];
          document.querySelectorAll('.cat-checkbox:checked').forEach(cb => {
            selectedCategories.push(cb.value);
          });

          if (selectedCategories.length === 0) {
            alert("Please select at least one category!");
            submitBtn.disabled = false;
            submitBtn.innerText = "Save & Publish Design";
            return;
          }

          const imageUrl = await uploadImageToImgBB(imageFile);
          if (!imageUrl) throw new Error("Failed to get Image URL from ImgBB");

          submitBtn.innerText = "Saving to Firebase Database...";

          const designData = {
            title: document.getElementById("title").value,
            description: document.getElementById("description").value,
            tags: document.getElementById("tags").value,
            fileUrl: document.getElementById("fileUrl").value,
            type: document.getElementById("type").value,
            price: document.getElementById("price").value || "0",
            categories: selectedCategories, // Array of categories
            imageUrl: imageUrl
          };

          addDesignToFirebase(designData, () => {
            alert("Design Published Successfully!");
            designForm.reset();
            document.querySelectorAll('.cat-checkbox').forEach(cb => cb.checked = false);
            submitBtn.disabled = false;
            submitBtn.innerText = "Save & Publish Design";
          });

        } catch (error) {
          console.error(error);
          alert("Error: " + error.message);
          submitBtn.disabled = false;
          submitBtn.innerText = "Save & Publish Design";
        }
      });
    }

    // Filter Logic for Manage Section
    window.applyFilters = function() {
      const designs = window.allAdminDesigns || [];
      const catFilter = document.getElementById('filterCategory').value;
      const typeFilter = document.getElementById('filterType').value;
      const dateFilter = document.getElementById('filterDate').value;

      let filtered = designs.filter(item => {
        let matchCat = (catFilter === 'all') || (Array.isArray(item.categories) && item.categories.includes(catFilter));
        let matchType = (typeFilter === 'all') || (item.type === typeFilter);
        return matchCat && matchType;
      });

      // Date sorting
      filtered.sort((a, b) => {
        const timeA = a.id || 0;
        const timeB = b.id || 0;
        return dateFilter === 'newest' ? timeB - timeA : timeA - timeB;
      });

      renderManageTable(filtered);
    };

    // Render Manage Table
    function renderManageTable(designs) {
      const container = document.getElementById('manageContainer');

      if (designs.length === 0) {
        container.innerHTML = `
          <div class="text-center py-12 text-gray-400">
            <i class="fa-solid fa-box-open text-4xl mb-2"></i>
            <p>No designs match your filter criteria.</p>
          </div>
        `;
        return;
      }

      let html = `
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-gray-50 text-gray-600 uppercase text-xs border-b border-gray-200">
              <th class="py-3 px-4">Preview</th>
              <th class="py-3 px-4">Title</th>
              <th class="py-3 px-4">Categories</th>
              <th class="py-3 px-4">Type / Price</th>
              <th class="py-3 px-4 text-center">Actions</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-gray-100 text-sm">
      `;

      designs.forEach(item => {
        const isFree = item.type === 'Free';
        const badgeClass = isFree ? 'bg-green-100 text-green-700' : 'bg-yellow-100 text-yellow-800';
        const priceLabel = isFree ? 'Free' : `$${item.price || '0'}`;
        const cats = Array.isArray(item.categories) ? item.categories.join(', ') : 'General';

        html += `
          <tr class="hover:bg-gray-50/80 transition">
            <td class="py-3 px-4">
              <img src="${item.imageUrl}" alt="" class="w-12 h-12 object-cover rounded-lg shadow-sm border">
            </td>
            <td class="py-3 px-4 font-semibold text-slate-900">${item.title}</td>
            <td class="py-3 px-4 text-gray-600">${cats}</td>
            <td class="py-3 px-4">
              <span class="px-2.5 py-1 rounded-md text-xs font-bold ${badgeClass}">${priceLabel}</span>
            </td>
            <td class="py-3 px-4 text-center">
              <button onclick="confirmDelete('${item.firebaseId}')" class="bg-red-50 text-red-600 hover:bg-red-500 hover:text-white px-3 py-1.5 rounded-lg text-xs font-semibold transition">
                <i class="fa-solid fa-trash mr-1"></i> Delete
              </button>
            </td>
          </tr>
        `;
      });

      html += `</tbody></table>`;
      container.innerHTML = html;
    }

    window.confirmDelete = function(firebaseId) {
      if (confirm("Are you sure you want to delete this design?")) {
        deleteDesignFromFirebase(firebaseId, () => {
          alert("Design deleted successfully!");
        });
      }
    };
  </script>
</body>
</html>
