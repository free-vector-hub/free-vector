<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Vector Hub - Jersey Showcase</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between">

    <!-- HEADER / NAVIGATION -->
    <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3 cursor-pointer" onclick="filterCategory('all')">
                <div class="bg-indigo-600 p-2 rounded-xl text-white font-bold text-xl">
                    <i class="fa-solid fa-shirt"></i>
                </div>
                <span class="text-xl font-bold tracking-wide bg-gradient-to-r from-indigo-400 to-cyan-400 bg-clip-text text-transparent">FreeVectorHub</span>
            </div>
            
            <!-- Category Filter Buttons -->
            <nav class="hidden md:flex items-center space-x-6 text-sm font-medium">
                <button onclick="filterCategory('all')" class="nav-btn text-indigo-400">All</button>
                <button onclick="filterCategory('Football')" class="nav-btn text-slate-300 hover:text-indigo-400">Football</button>
                <button onclick="filterCategory('Cricket')" class="nav-btn text-slate-300 hover:text-indigo-400">Cricket</button>
                <button onclick="filterCategory('Esports')" class="nav-btn text-slate-300 hover:text-indigo-400">Esports</button>
                <button onclick="filterCategory('Premium')" class="nav-btn text-amber-400 font-semibold flex items-center"><i class="fa-solid fa-crown mr-1"></i> Premium</button>
            </nav>

            <!-- User Auth -->
            <div class="flex items-center space-x-4">
                <div id="auth-container">
                    <button id="login-btn" onclick="loginWithGoogle()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-xl text-xs font-semibold transition flex items-center shadow-lg shadow-indigo-600/20">
                        <i class="fa-brands fa-google mr-2"></i> Sign In
                    </button>
                    <div id="user-profile" class="hidden items-center space-x-3">
                        <img id="user-avatar" src="" alt="User" class="w-8 h-8 rounded-full border border-indigo-500">
                        <button onclick="logout()" class="text-slate-400 hover:text-rose-400 text-sm transition" title="Sign Out">
                            <i class="fa-solid fa-right-from-bracket"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- AD ADSENSE BANNER (TOP) -->
    <div class="bg-slate-900/60 border-b border-slate-800/60 py-2 text-center text-xs text-slate-500">
        <span>Advertisement Space (Google AdSense Responsive Banner)</span>
    </div>

    <!-- MAIN GALLERY GRID (Clean Pinterest-style grid as requested) -->
    <main class="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8 py-8 flex-grow w-full">
        <!-- Jersey Grid -->
        <div id="jersey-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-4 gap-3 sm:gap-5">
            <!-- Dynamic Image Cards Loaded via JS -->
        </div>
    </main>

    <!-- AD ADSENSE BANNER (BOTTOM) -->
    <div class="bg-slate-900 border-t border-slate-800 py-3 text-center text-xs text-slate-500 my-6">
        <span>Advertisement Space (Google AdSense Display Ad)</span>
    </div>

    <!-- FOOTER -->
    <footer class="bg-slate-900 border-t border-slate-800 text-slate-400 py-6 text-xs text-center">
        <p>&copy; 2026 FreeVectorHub. All rights reserved.</p>
    </footer>

    <!-- MODAL: DESIGN DETAILS PAGE (Opened on Image Click) -->
    <div id="detail-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/85 backdrop-blur-md hidden p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-3xl w-full overflow-hidden shadow-2xl relative animate-in fade-in zoom-in duration-200">
            <button onclick="closeModal()" class="absolute top-4 right-4 bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white w-9 h-9 rounded-full flex items-center justify-center transition z-10">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <div id="modal-content" class="p-6 sm:p-8 max-h-[90vh] overflow-y-auto">
                <!-- Content Injected via JS -->
            </div>
        </div>
    </div>

    <!-- FIREBASE AUTHENTICATION MODULE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDummyKeyForDemoPurposesOnly12345",
            authDomain: "freevectorhub.firebaseapp.com",
            projectId: "freevectorhub",
            storageBucket: "freevectorhub.appspot.com",
            messagingSenderId: "1234567890",
            appId: "1:123456:web:abcdef"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        window.loginWithGoogle = function() {
            signInWithPopup(auth, provider).catch(() => {
                simulateLogin({
                    displayName: "Alex",
                    photoURL: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100"
                });
            });
        };

        window.logout = function() {
            signOut(auth).then(() => {
                localStorage.removeItem('simulated_user');
                updateUI(null);
            });
        };

        onAuthStateChanged(auth, (user) => {
            if (user) updateUI(user);
            else {
                const saved = localStorage.getItem('simulated_user');
                updateUI(saved ? JSON.parse(saved) : null);
            }
        });

        function simulateLogin(userObj) {
            localStorage.setItem('simulated_user', JSON.stringify(userObj));
            updateUI(userObj);
        }

        function updateUI(user) {
            const loginBtn = document.getElementById('login-btn');
            const profileDiv = document.getElementById('user-profile');
            if (user) {
                loginBtn.classList.add('hidden');
                profileDiv.classList.remove('hidden');
                profileDiv.classList.add('flex');
                document.getElementById('user-avatar').src = user.photoURL;
            } else {
                loginBtn.classList.remove('hidden');
                profileDiv.classList.add('hidden');
            }
        }
    </script>

    <!-- DATA & LOGIC -->
    <script>
        const jerseys = [
            {
                id: 1,
                title: "Gold & Black Luxury Football Kit",
                category: "Football",
                type: "Premium",
                price: "$4.99",
                image: "https://images.unsplash.com/photo-1518063319789-7217ed6e297f?w=600",
                description: "Premium gold vector artwork pattern with high-resolution vector layers suitable for sublimation printing.",
                tags: ["Football", "Gold", "Luxury", "Vector"]
            },
            {
                id: 2,
                title: "White & Gold Sublimation Jersey Pattern",
                category: "Cricket",
                type: "Free",
                price: "Free",
                image: "https://images.unsplash.com/photo-1540747913346-19e32dc3e97e?w=600",
                description: "Clean modern cricket team kit concept with customizable text and sponsor badge vector layers.",
                tags: ["Cricket", "White", "Sports"]
            },
            {
                id: 3,
                title: "Red & White Spike Volleyball Jersey",
                category: "Volleyball",
                type: "Free",
                price: "Free",
                image: "https://images.unsplash.com/photo-1508098682722-e99c43a406b2?w=600",
                description: "Dynamic splash vector graphics for athletic uniforms. AI & EPS formats available.",
                tags: ["Volleyball", "Red", "Splash"]
            },
            {
                id: 4,
                title: "Orange Sunrisers Cricket Concept",
                category: "Cricket",
                type: "Free",
                price: "Free",
                image: "https://images.unsplash.com/photo-1519766304817-4f37bda74a26?w=600",
                description: "Vibrant orange and black cricket tournament team jersey design template.",
                tags: ["Cricket", "Orange", "Tournament"]
            },
            {
                id: 5,
                title: "Polynesian Tribal Pattern Polo Jersey",
                category: "Polo",
                type: "Premium",
                price: "$6.99",
                image: "https://images.unsplash.com/photo-1511512578047-dfb367046420?w=600",
                description: "Detailed cultural Polynesian tribal tattoo pattern jersey design with collar vector mockups.",
                tags: ["Polo", "Tribal", "Pattern", "Culture"]
            },
            {
                id: 6,
                title: "Royal Blue Liquid Water Esports Jersey",
                category: "Esports",
                type: "Premium",
                price: "$8.99",
                image: "https://images.unsplash.com/photo-1560272564-c83b66b1ad12?w=600",
                description: "High-tech gaming jersey pattern featuring wave energy graphics and sponsor branding areas.",
                tags: ["Esports", "Blue", "Water", "Gaming"]
            },
            {
                id: 7,
                title: "Neon Dragon Green Sports Uniform",
                category: "Football",
                type: "Free",
                price: "Free",
                image: "https://images.unsplash.com/photo-1518063319789-7217ed6e297f?w=600",
                description: "Aggressive dragon theme sports concept design in neon lime green and deep black.",
                tags: ["Dragon", "Green", "Football"]
            },
            {
                id: 8,
                title: "Purple Lightning Esports Gaming Polo",
                category: "Esports",
                type: "Premium",
                price: "$5.99",
                image: "https://images.unsplash.com/photo-1511512578047-dfb367046420?w=600",
                description: "Electric lightning vector design bundle. Perfect for streaming teams and esports tournaments.",
                tags: ["Lightning", "Purple", "Esports"]
            }
        ];

        function renderJerseys(items) {
            const grid = document.getElementById('jersey-grid');
            grid.innerHTML = items.map(j => `
                <div onclick="openModal(${j.id})" class="relative group cursor-pointer overflow-hidden rounded-2xl bg-slate-900 border border-slate-800/80 hover:border-indigo-500/60 transition duration-300 shadow-md aspect-[4/5]">
                    <!-- Image Only in Homepage -->
                    <img src="${j.image}" alt="${j.title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500">
                    
                    <!-- Paid / Premium Crown Icon Overlay (As shown in image) -->
                    ${j.type === 'Premium' ? `
                        <div class="absolute top-2.5 right-2.5 bg-slate-900/85 backdrop-blur-md p-1.5 px-2 rounded-lg border border-amber-500/40 shadow-lg text-amber-400 text-xs font-bold flex items-center">
                            <i class="fa-solid fa-crown text-amber-400"></i>
                        </div>
                    ` : ''}

                    <!-- Slight dark overlay on hover -->
                    <div class="absolute inset-0 bg-black/20 opacity-0 group-hover:opacity-100 transition duration-300"></div>
                </div>
            `).join('');
        }

        function filterCategory(cat) {
            if (cat === 'all') renderJerseys(jerseys);
            else if (cat === 'Premium') renderJerseys(jerseys.filter(j => j.type === 'Premium'));
            else renderJerseys(jerseys.filter(j => j.category === cat));
        }

        function openModal(id) {
            const j = jerseys.find(item => item.id === id);
            const modal = document.getElementById('detail-modal');
            const content = document.getElementById('modal-content');

            content.innerHTML = `
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 items-center">
                    <div class="rounded-xl overflow-hidden bg-slate-950 aspect-[4/5] relative">
                        <img src="${j.image}" alt="${j.title}" class="w-full h-full object-cover">
                        ${j.type === 'Premium' ? `
                            <div class="absolute top-3 right-3 bg-amber-500 text-slate-950 font-bold text-xs px-2.5 py-1 rounded-lg shadow-lg flex items-center">
                                <i class="fa-solid fa-crown mr-1"></i> Premium Asset
                            </div>
                        ` : ''}
                    </div>
                    <div>
                        <div class="flex items-center space-x-2 mb-2">
                            <span class="bg-indigo-500/10 text-indigo-400 text-xs px-2.5 py-1 rounded-md font-medium border border-indigo-500/20">${j.category}</span>
                        </div>
                        <h2 class="text-2xl font-bold text-white">${j.title}</h2>
                        <p class="text-slate-300 text-xs sm:text-sm mt-3 leading-relaxed">${j.description}</p>
                        
                        <!-- Tags -->
                        <div class="mt-4 flex flex-wrap gap-2">
                            ${j.tags.map(t => `<span class="bg-slate-800 text-slate-400 text-xs px-2.5 py-1 rounded-lg">#${t}</span>`).join('')}
                        </div>

                        <!-- Price & Download / Buy Section -->
                        <div class="mt-8 pt-5 border-t border-slate-800 flex items-center justify-between">
                            <div>
                                <span class="text-xs text-slate-400 block">License / Price</span>
                                <span class="text-xl font-extrabold ${j.type === 'Premium' ? 'text-amber-400' : 'text-emerald-400'}">${j.price}</span>
                            </div>
                            <div>
                                ${j.type === 'Premium' 
                                    ? `<button onclick="alert('Redirecting to payment gateway...')" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold px-6 py-2.5 rounded-xl transition shadow-lg flex items-center text-sm"><i class="fa-solid fa-cart-shopping mr-2"></i> Buy & Download</button>`
                                    : `<button onclick="alert('Download started!')" class="bg-indigo-600 hover:bg-indigo-500 text-white font-semibold px-6 py-2.5 rounded-xl transition shadow-lg flex items-center text-sm"><i class="fa-solid fa-download mr-2"></i> Download Vector</button>`
                                }
                            </div>
                        </div>
                    </div>
                </div>
            `;
            modal.classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('detail-modal').classList.add('hidden');
        }

        // Initial Load
        renderJerseys(jerseys);
    </script>
</body>
</html>
